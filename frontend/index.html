<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <title>Dog Breeds</title>
</head>
<body>
  <main>
    <section class="left-section">
      <h1>Dog breeds</h1>
      <p>Enter a new dog breed and it will show up in the list.</p>
      <input id="messageInput" class="inputBox">
      <button id="button" type="button">Send</button>
      <div id="dogIcon">
        <img src="../kiss.png" alt="Dog face">
        <p>designed by <a href="https://www.flaticon.com/authors/aomam">AomAm</a> from <a href="https://www.flaticon.com">Flaticon</a></p>
      </div>
    </section>
    <section class="breed-card">
      <h2>Breed List</h2>
      <ul id="breedList"></ul>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
