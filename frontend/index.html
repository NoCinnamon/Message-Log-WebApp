<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dog Breeds</title>
</head>
<body>
  <main>
    <section class="entry">
      <h1>Dog breeds</h1>
      <p>Enter a new dog breed and it will show up in the list.</p>
      <input id="messageInput" class="inputBox">
      <button id="button" type="button">Send</button>
    </section>
    <section class="breed-card">
      <h2>Breed List</h2>
      <ul id="breedList"></ul>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
